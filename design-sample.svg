<circle cx="540" cy="570" r="380" fill="none" stroke="#a855f7" stroke-width="1"   opacity="0.2"/>
<circle cx="540" cy="570" r="480" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.1"/>

