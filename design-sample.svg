<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs>
  <radialGradient id="bg" cx="50%" cy="44%" r="65%">
    <stop offset="0%"   stop-color="#0d1a30"/>
    <stop offset="55%"  stop-color="#080e1c"/>
    <stop offset="100%" stop-color="#020508"/>
  </radialGradient>

  <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%"  stop-color="#00d4ff" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
  </radialGradient>

  <filter id="glow-lg" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-sm" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-txt" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#00d4ff" stroke-width="0.4" opacity="0.05"/>
    <line x1="0" y1="0" x2="0" y2="90" stroke="#00d4ff" stroke-width="0.4" opacity="0.05"/>
  </pattern>

  <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#00d4ff" stroke-width="0.3" opacity="0.03"/>
  </pattern>
</defs>

<!-- ── BACKGROUND ───────────────────────────── -->
<rect width="1080" height="1350" fill="url(#bg)"/>
<rect width="1080" height="1350" fill="url(#grid)"/>
<rect width="1080" height="1350" fill="url(#scan)"/>

<!-- ── CORE RADIAL GLOW ─────────────────────── -->
<ellipse cx="540" cy="570" rx="380" ry="380" fill="url(#core-glow)"/>

<!-- ── RADAR RINGS ──────────────────────────── -->
<circle cx="540" cy="570" r="70"  fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.18"/>
