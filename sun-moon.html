<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day to Night</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background: #000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
}
.wrap {
    width: min(360px, 100vw);
    aspect-ratio: 3/4;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
}
svg { width:100%; height:100%; display:block; }

/* ── TIMING: 12s loop ────────────────────────
   0–30%  : full day
   30–50% : sunset
   50–70% : night arrives
   70–88% : full night
   88–100%: reset to dawn
──────────────────────────────────────────── */

@keyframes skyDay    { 0%,28%{opacity:1} 48%,88%{opacity:0} 96%,100%{opacity:1} }
@keyframes skySunset { 0%,25%{opacity:0} 36%,52%{opacity:1} 65%,100%{opacity:0} }
@keyframes skyNight  { 0%,48%{opacity:0} 66%,84%{opacity:1} 96%,100%{opacity:0} }

@keyframes groundDay   { 0%,28%{opacity:1} 52%,96%{opacity:0} 100%{opacity:1} }
@keyframes groundNight { 0%,50%{opacity:0} 68%,84%{opacity:1} 96%,100%{opacity:0} }

@keyframes sunAnim {
  0%   { transform:translateY(0px);   opacity:1; }
  28%  { transform:translateY(0px);   opacity:1; }
  48%  { transform:translateY(90px);  opacity:0; }
  96%  { transform:translateY(90px);  opacity:0; }
  100% { transform:translateY(0px);   opacity:1; }
}

@keyframes moonAnim {
  0%,50%  { transform:translateY(110px); opacity:0; }
  68%     { transform:translateY(0px);   opacity:1; }
  84%     { transform:translateY(0px);   opacity:1; }
  96%     { transform:translateY(-50px); opacity:0; }
  100%    { transform:translateY(110px); opacity:0; }
}

@keyframes starsOp {
  0%,52%   { opacity:0; }
  70%,84%  { opacity:1; }
  96%,100% { opacity:0; }
}

@keyframes twA { 0%,100%{opacity:1;   transform:scale(1);}   50%{opacity:0.15; transform:scale(0.5);} }
@keyframes twB { 0%,100%{opacity:0.6; transform:scale(1);}   50%{opacity:1;    transform:scale(1.4);} }
@keyframes twC { 0%,100%{opacity:0.9; transform:scale(1);}   33%{opacity:0.1;  transform:scale(0.6);} 66%{opacity:1; transform:scale(1.2);} }

@keyframes raysRotate { to { transform:rotate(360deg); } }

@keyframes cloudFloat1 { 0%,100%{transform:translateX(0)}  50%{transform:translateX(14px)} }
@keyframes cloudFloat2 { 0%,100%{transform:translateX(0)}  50%{transform:translateX(-10px)} }
@keyframes cloudDay    { 0%,26%{opacity:1} 50%,100%{opacity:0} }

@keyframes sunGlowPulse { 0%,100%{opacity:0.35} 50%{opacity:0.65} }
@keyframes moonGlowPulse{ 0%,100%{opacity:0.3}  50%{opacity:0.55} }

@keyframes zFloat {
  0%   { transform:translate(0,0);   opacity:0; }
  10%  { opacity:1; }
  100% { transform:translate(-8px,-28px); opacity:0; }
}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4A90D9"/>
    <stop offset="100%" stop-color="#A8D8F0"/>
  </linearGradient>
  <linearGradient id="gSunset" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#C0392B"/>
    <stop offset="45%"  stop-color="#E87040"/>
    <stop offset="100%" stop-color="#F5C842"/>
  </linearGradient>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#02050E"/>
    <stop offset="100%" stop-color="#071428"/>
  </linearGradient>
  <linearGradient id="gGrassD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#57A639"/>
    <stop offset="100%" stop-color="#3A7D26"/>
  </linearGradient>
  <linearGradient id="gGrassN" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"  stop-color="#162B12"/>
    <stop offset="100%" stop-color="#0A1A08"/>
  </linearGradient>
  <radialGradient id="rSun" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#FFE44D" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rMoon" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#B8C8FF" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#7090C0" stop-opacity="0"/>
  </radialGradient>
  <!-- Crescent mask: moon circle minus offset inner circle -->
  <mask id="crescentMask">
    <rect width="360" height="480" fill="white"/>
    <circle cx="285" cy="158" r="65" fill="black"/>
  </mask>
</defs>

<!-- ══ SKY ════════════════════════════════════ -->
<rect width="360" height="480" fill="url(#gDay)"    style="animation:skyDay    12s linear infinite"/>
<rect width="360" height="480" fill="url(#gSunset)" style="animation:skySunset 12s linear infinite; opacity:0"/>
<rect width="360" height="480" fill="url(#gNight)"  style="animation:skyNight  12s linear infinite; opacity:0"/>

<!-- ══ STARS ══════════════════════════════════ -->
<g style="animation:starsOp 12s linear infinite; opacity:0">
  <!-- big bright stars -->
  <circle cx="42"  cy="52"  r="2.8" fill="#fff" style="animation:twA 1.3s 0.0s ease-in-out infinite; transform-origin:42px 52px"/>
  <circle cx="162" cy="38"  r="3.2" fill="#ffe" style="animation:twB 1.7s 0.5s ease-in-out infinite; transform-origin:162px 38px; filter:drop-shadow(0 0 4px #fff)"/>
  <circle cx="308" cy="44"  r="2.5" fill="#fff" style="animation:twA 1.5s 1.1s ease-in-out infinite; transform-origin:308px 44px"/>
  <!-- medium stars -->
  <circle cx="90"  cy="28"  r="1.8" fill="#fff" style="animation:twC 2.0s 0.3s ease-in-out infinite; transform-origin:90px 28px"/>
  <circle cx="130" cy="72"  r="1.6" fill="#fff" style="animation:twB 1.8s 0.8s ease-in-out infinite; transform-origin:130px 72px"/>
  <circle cx="198" cy="62"  r="2.0" fill="#ffe" style="animation:twA 1.4s 0.2s ease-in-out infinite; transform-origin:198px 62px"/>
  <circle cx="340" cy="80"  r="1.8" fill="#fff" style="animation:twC 1.6s 0.6s ease-in-out infinite; transform-origin:340px 80px"/>
  <circle cx="56"  cy="108" r="1.5" fill="#fff" style="animation:twB 2.1s 1.4s ease-in-out infinite; transform-origin:56px 108px"/>
  <circle cx="328" cy="116" r="1.6" fill="#fff" style="animation:twA 1.9s 0.9s ease-in-out infinite; transform-origin:328px 116px"/>
  <!-- small stars -->
  <circle cx="74"  cy="168" r="1.2" fill="#fff" style="animation:twC 1.5s 0.4s ease-in-out infinite; transform-origin:74px 168px"/>
  <circle cx="225" cy="25"  r="1.4" fill="#fff" style="animation:twA 2.2s 1.2s ease-in-out infinite; transform-origin:225px 25px"/>
  <circle cx="270" cy="90"  r="1.2" fill="#fff" style="animation:twB 1.6s 0.7s ease-in-out infinite; transform-origin:270px 90px"/>
  <circle cx="30"  cy="140" r="1.0" fill="#fff" style="animation:twA 2.0s 1.6s ease-in-out infinite; transform-origin:30px 140px"/>
</g>

<!-- ══ MOON ════════════════════════════════════ -->
<g style="animation:moonAnim 12s linear infinite; opacity:0">
  <!-- soft glow halo -->
  <circle cx="250" cy="165" r="100" fill="url(#rMoon)" style="animation:moonGlowPulse 3s ease-in-out infinite"/>
  <!-- crescent body -->
  <circle cx="250" cy="165" r="75" fill="#FFFDE7" mask="url(#crescentMask)"/>
  <!-- slight inner shadow to give depth -->
  <circle cx="250" cy="165" r="75" fill="none" stroke="rgba(180,160,80,0.3)" stroke-width="3" mask="url(#crescentMask)"/>

  <!-- SLEEPY FACE — positioned on left crescent (x~175-220) -->
  <!-- left eye: closed arc (like a little squint) -->
  <path d="M 185,153 Q 193,146 201,153" fill="none" stroke="#8B7030" stroke-width="3" stroke-linecap="round"/>
  <!-- right eye: closed arc -->
  <path d="M 201,147 Q 209,140 217,147" fill="none" stroke="#8B7030" stroke-width="3" stroke-linecap="round"/>
  <!-- warm rosy cheeks -->
  <ellipse cx="184" cy="168" rx="11" ry="7" fill="#FFAAAA" opacity="0.5"/>
  <ellipse cx="215" cy="162" rx="10" ry="7" fill="#FFAAAA" opacity="0.45"/>
  <!-- gentle sleepy smile -->
  <path d="M 186,173 Q 200,183 214,173" fill="none" stroke="#8B7030" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ZZZ floating up -->
  <text x="235" y="132" font-size="13" font-weight="bold" fill="#B8C8FF" opacity="0.75" font-family="Arial, sans-serif"
    style="animation:zFloat 2.8s 0.0s ease-in-out infinite">z</text>
  <text x="248" y="113" font-size="17" font-weight="bold" fill="#B8C8FF" opacity="0.5" font-family="Arial, sans-serif"
    style="animation:zFloat 2.8s 0.9s ease-in-out infinite">z</text>
  <text x="264" y="90" font-size="21" font-weight="bold" fill="#B8C8FF" opacity="0.3" font-family="Arial, sans-serif"
    style="animation:zFloat 2.8s 1.8s ease-in-out infinite">z</text>
</g>

<!-- ══ SUN ═════════════════════════════════════ -->
<g style="animation:sunAnim 12s linear infinite">
  <!-- warm glow halo -->
  <circle cx="180" cy="200" r="100" fill="url(#rSun)" style="animation:sunGlowPulse 2.5s ease-in-out infinite"/>
  <!-- rotating rays -->
  <g style="transform-origin:180px 200px; animation:raysRotate 14s linear infinite">
    <!-- 8 rays -->
    <line x1="180" y1="128" x2="180" y2="112" stroke="#FFD700" stroke-width="7" stroke-linecap="round"/>
    <line x1="180" y1="272" x2="180" y2="288" stroke="#FFD700" stroke-width="7" stroke-linecap="round"/>
    <line x1="108" y1="200" x2="92"  y2="200" stroke="#FFD700" stroke-width="7" stroke-linecap="round"/>
    <line x1="252" y1="200" x2="268" y2="200" stroke="#FFD700" stroke-width="7" stroke-linecap="round"/>
    <line x1="129" y1="149" x2="118" y2="138" stroke="#FFD700" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="231" y1="251" x2="242" y2="262" stroke="#FFD700" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="231" y1="149" x2="242" y2="138" stroke="#FFD700" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="129" y1="251" x2="118" y2="262" stroke="#FFD700" stroke-width="5.5" stroke-linecap="round"/>
  </g>
  <!-- sun body -->
  <circle cx="180" cy="200" r="62" fill="#FFD700" stroke="#FFA000" stroke-width="3.5"/>
  <!-- HAPPY FACE -->
  <!-- eyes: dark with sparkle -->
  <circle cx="161" cy="190" r="9"   fill="#5D3A00"/>
  <circle cx="199" cy="190" r="9"   fill="#5D3A00"/>
  <circle cx="164" cy="186" r="3"   fill="#fff"/>
  <circle cx="202" cy="186" r="3"   fill="#fff"/>
  <!-- big happy smile -->
  <path d="M 152,214 Q 180,242 208,214" fill="none" stroke="#5D3A00" stroke-width="5" stroke-linecap="round"/>
  <!-- rosy cheeks -->
  <ellipse cx="144" cy="218" rx="16" ry="10" fill="#FF8A65" opacity="0.4"/>
  <ellipse cx="216" cy="218" rx="16" ry="10" fill="#FF8A65" opacity="0.4"/>
</g>

<!-- ══ CLOUDS ══════════════════════════════════ -->
<!-- Cloud 1 — big, foreground -->
<g style="animation:cloudFloat1 7s ease-in-out infinite">
  <g style="animation:cloudDay 12s linear infinite">
    <ellipse cx="78"  cy="132" rx="48" ry="30" fill="#fff"/>
    <ellipse cx="118" cy="120" rx="40" ry="28" fill="#fff"/>
    <ellipse cx="154" cy="134" rx="36" ry="25" fill="#fff"/>
    <ellipse cx="112" cy="146" rx="55" ry="20" fill="#fff"/>
  </g>
</g>
<!-- Cloud 2 — smaller, background -->
<g style="animation:cloudFloat2 9s ease-in-out infinite">
  <g style="animation:cloudDay 12s linear infinite; opacity:0.8">
    <ellipse cx="268" cy="105" rx="34" ry="22" fill="#fff"/>
    <ellipse cx="302" cy="96"  rx="28" ry="20" fill="#fff"/>
    <ellipse cx="332" cy="108" rx="26" ry="18" fill="#fff"/>
    <ellipse cx="300" cy="118" rx="40" ry="15" fill="#fff"/>
  </g>
</g>

<!-- ══ GROUND ══════════════════════════════════ -->
<rect x="0"   y="400" width="360" height="80" fill="url(#gGrassD)" style="animation:groundDay   12s linear infinite"/>
<rect x="0"   y="400" width="360" height="80" fill="url(#gGrassN)" style="animation:groundNight 12s linear infinite; opacity:0"/>
<!-- rolling hills -->
<ellipse cx="100" cy="402" rx="155" ry="34" fill="#4CAF50" style="animation:groundDay   12s linear infinite"/>
<ellipse cx="100" cy="402" rx="155" ry="34" fill="#162B12" style="animation:groundNight 12s linear infinite; opacity:0"/>
<ellipse cx="290" cy="408" rx="140" ry="28" fill="#5CB85C" style="animation:groundDay   12s linear infinite"/>
<ellipse cx="290" cy="408" rx="140" ry="28" fill="#1A341A" style="animation:groundNight 12s linear infinite; opacity:0"/>

</svg>
</div>
</body>
</html>
