<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Session – Ad1.tv | Video &amp; Photo Editing Tutoring</title>
<meta name="description" content="Book a one-on-one video or photo editing tutoring session with Ad1.tv. Learn Photoshop, Premiere Pro, DaVinci Resolve, AI tools and more via Zoom or Google Meet.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://ad1.tv/booksession.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ad1.tv/booksession.html">
<meta property="og:title" content="Book a Session – Ad1.tv">
<meta property="og:description" content="Book a one-on-one editing tutoring session. Learn Photoshop, Premiere, DaVinci, AI tools &amp; more via Zoom or Google Meet.">
<meta property="og:image" content="https://ad1.tv/img/og-preview.jpg">
<style>
@keyframes pulse  { 0%,100%{transform:scale(1);   opacity:0.6} 50%{transform:scale(1.55); opacity:0} }
@keyframes pulse2 { 0%,100%{transform:scale(1);   opacity:0.4} 50%{transform:scale(1.9);  opacity:0} }
@keyframes ringIn { from{transform:scale(0.4); opacity:0} to{transform:scale(1); opacity:1} }
@keyframes lineGrow { from{width:0} to{width:100%} }
@keyframes fadeUp  { from{opacity:0; transform:translateY(28px)} to{opacity:1; transform:translateY(0)} }
@keyframes fadeDown{ from{opacity:0; transform:translateY(-28px)} to{opacity:1; transform:translateY(0)} }
@keyframes elastic { 0%{opacity:0;transform:scale(0) skewX(-18deg)} 60%{opacity:1;transform:scale(1.18) skewX(-18deg)} 80%{transform:scale(0.95) skewX(-18deg)} 100%{opacity:1;transform:scale(1) skewX(-18deg)} }
@keyframes popIn   { 0%{opacity:0;transform:scale(0)} 60%{transform:scale(1.2)} 80%{transform:scale(0.92)} 100%{opacity:1;transform:scale(1)} }
@keyframes drawCirc{ from{stroke-dashoffset:502} to{stroke-dashoffset:0} }
@keyframes slideL  { from{opacity:0;transform:translateX(-40px)} to{opacity:1;transform:translateX(0)} }
@keyframes slideR  { from{opacity:0;transform:translateX(40px)}  to{opacity:1;transform:translateX(0)} }
@keyframes pillIn  { from{opacity:0;transform:translateY(20px) scale(0.8)} to{opacity:1;transform:translateY(0) scale(1)} }
@keyframes shapeSpin { to{transform:rotate(360deg)} }
@keyframes burst   { 0%{opacity:0;transform:scale(0) rotate(0deg)} 60%{opacity:1;transform:scale(1.1) rotate(200deg)} 100%{opacity:1;transform:scale(1) rotate(180deg)} }
@keyframes twinkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.2;transform:scale(0.4)} }

* { box-sizing:border-box; margin:0; padding:0; }

body {
    background: #040810;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'FreightNeo Pro','freight-neo-pro',serif;
    overflow: hidden;
}

.stage {
    width: min(520px, 100vw);
    height: min(360px, 100svh);
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    background: radial-gradient(ellipse at 30% 20%, #0e1a2e 0%, #080e1c 55%, #040810 100%);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 0 80px rgba(0,0,0,0.8);
}

/* ── SCENES ────────────────────────────── */
.scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 40px;
    will-change: transform;
    transform: translateX(100%);
}
.scene.current { transform: translateX(0); }
.sliding { transition: transform 0.52s cubic-bezier(0.77, 0, 0.175, 1); }

/* ── NAV ───────────────────────────────── */
.nav {
    position: absolute;
    bottom: 16px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 10;
}
.nav-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.nav-btn:hover { background:rgba(0,212,255,0.15); color:#00d4ff; border-color:rgba(0,212,255,0.4); }
.nav-dots { display:flex; gap:8px; align-items:center; }
.dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.2); transition:all 0.3s; }
.dot.on { background:#00d4ff; box-shadow:0 0 8px rgba(0,212,255,0.8); transform:scale(1.3); }

/* ══════════════════════════════════════
   SCREEN 1 — CALL
══════════════════════════════════════ */
#s1 { gap: 10px; }

.pulse-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
}
.pulse-ring {
    position: absolute;
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 2px solid #00d4ff;
}
.pulse-ring.r1 { animation: pulse  2s 0s ease-out infinite; }
.pulse-ring.r2 { animation: pulse2 2s 0.6s ease-out infinite; }
.phone-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: rgba(0,212,255,0.12);
    border: 2px solid rgba(0,212,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    animation: ringIn 0.6s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
    filter: drop-shadow(0 0 16px rgba(0,212,255,0.5));
}
.s1-label {
    font-size: clamp(0.65rem, 1.4vw, 0.9rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-weight: 700;
    animation: fadeUp 0.5s 0.2s ease-out both;
}
.s1-number {
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 900;
    color: #00d4ff;
    letter-spacing: 0.04em;
    filter: drop-shadow(0 0 20px rgba(0,212,255,0.6));
    animation: fadeUp 0.6s 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
.s1-number a { color: inherit; text-decoration: none; }
.s1-sub {
    font-size: clamp(0.75rem, 1.6vw, 1rem);
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    animation: fadeUp 0.5s 0.55s ease-out both;
}

/* ══════════════════════════════════════
   SCREEN 2 — BOOK A SESSION
══════════════════════════════════════ */
#s2 { gap: 14px; }

.s2-step {
    font-size: clamp(0.65rem, 1.3vw, 0.85rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #a855f7;
    font-weight: 700;
    animation: fadeDown 0.5s 0.1s ease-out both;
}
.s2-headline {
    font-size: clamp(2.4rem, 6.5vw, 4.2rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.02em;
    line-height: 1;
    text-align: center;
    animation: fadeUp 0.6s 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
}
.s2-headline em {
    font-style: normal;
    background: linear-gradient(135deg, #a855f7, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.s2-line-wrap { width: 100%; overflow: hidden; position: relative; height: 4px; }
.s2-line {
    height: 4px;
    width: 0;
    background: linear-gradient(90deg, #a855f7, #00d4ff);
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(168,85,247,0.7);
    animation: lineGrow 0.9s 0.55s cubic-bezier(0.4,0,0.2,1) both;
}
.s2-sub {
    font-size: clamp(0.85rem, 1.8vw, 1.15rem);
    color: rgba(255,255,255,0.45);
    text-align: center;
    letter-spacing: 0.06em;
    animation: fadeUp 0.5s 0.75s ease-out both;
}

/* ══════════════════════════════════════
   SCREEN 3 — MEET OR ZOOM
══════════════════════════════════════ */
#s3 { gap: 16px; }

.s3-step {
    font-size: clamp(0.65rem, 1.3vw, 0.85rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #00ff88;
    font-weight: 700;
    animation: fadeDown 0.5s 0.1s ease-out both;
}

.s3-split {
    display: flex;
    align-items: center;
    gap: 20px;
    animation: fadeUp 0.6s 0.25s ease-out both;
}

.s3-platform {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
}

.s3-icon {
    width: 64px; height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    border: 2px solid;
}

.s3-icon.meet {
    background: rgba(79,195,247,0.1);
    border-color: rgba(79,195,247,0.4);
    color: #4fc3f7;
    filter: drop-shadow(0 0 12px rgba(79,195,247,0.4));
    animation: slideL 0.6s 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}
.s3-icon.zoom {
    background: rgba(167,139,250,0.1);
    border-color: rgba(167,139,250,0.4);
    color: #a78bfa;
    filter: drop-shadow(0 0 12px rgba(167,139,250,0.4));
    animation: slideR 0.6s 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
}

.s3-name {
    font-size: clamp(0.7rem, 1.4vw, 0.95rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}
.s3-name.meet { color: #4fc3f7; animation: slideL 0.5s 0.5s ease-out both; }
.s3-name.zoom { color: #a78bfa; animation: slideR 0.5s 0.5s ease-out both; }

.s3-or {
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 900;
    color: rgba(255,255,255,0.15);
    letter-spacing: -0.02em;
}

.s3-headline {
    font-size: clamp(1.5rem, 3.5vw, 2.4rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.01em;
    text-align: center;
    animation: fadeUp 0.6s 0.65s cubic-bezier(0.34,1.56,0.64,1) both;
}
.s3-sub {
    font-size: clamp(0.75rem, 1.5vw, 1rem);
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    animation: fadeUp 0.5s 0.85s ease-out both;
}

/* ══════════════════════════════════════
   SCREEN 4 — CREATE!
══════════════════════════════════════ */
#s4 { gap: 8px; position: relative; overflow: hidden; }

/* background geometric shapes */
.bg-shape {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid;
    pointer-events: none;
}
.bg-shape.c1 { width:180px;height:180px; border-color:rgba(0,212,255,0.08);  top:-40px; right:-40px;  animation: burst 0.8s 0.1s ease-out both; }
.bg-shape.c2 { width:120px;height:120px; border-color:rgba(168,85,247,0.1);  bottom:-20px; left:-20px; animation: burst 0.8s 0.2s ease-out both; }
.bg-shape.c3 { width:60px; height:60px;  border-color:rgba(0,255,136,0.15);  top:30px; left:50px;      animation: burst 0.7s 0.3s ease-out both; }
.bg-shape.c4 { width:40px; height:40px;  border-color:rgba(245,158,11,0.2);  bottom:50px; right:60px;  animation: burst 0.7s 0.15s ease-out both; }
/* floating stars */
.star { position:absolute; width:6px;height:6px; border-radius:50%; pointer-events:none; }
.star.s1 { background:#00d4ff; top:22%; left:12%;  animation: popIn 0.5s 0.4s both, twinkle 1.8s 1s infinite; }
.star.s2 { background:#a855f7; top:18%; right:15%; animation: popIn 0.5s 0.55s both, twinkle 1.4s 1.2s infinite; }
.star.s3 { background:#00ff88; bottom:28%; left:18%; animation: popIn 0.5s 0.5s both, twinkle 2.0s 0.8s infinite; }
.star.s4 { background:#f59e0b; bottom:22%; right:12%; animation: popIn 0.5s 0.7s both, twinkle 1.6s 1.4s infinite; }
.star.s5 { background:#fff;    top:50%; left:7%;  animation: popIn 0.4s 0.6s both, twinkle 1.2s 1.0s infinite; width:4px;height:4px; }

.s4-step {
    font-size: clamp(0.65rem, 1.3vw, 0.85rem);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #f59e0b;
    font-weight: 700;
    animation: fadeDown 0.5s 0.1s ease-out both;
    position: relative;
}

.s4-word {
    font-size: clamp(4rem, 11vw, 7.5rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #f59e0b 0%, #ff6b9d 50%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(245,158,11,0.4));
    animation: elastic 0.7s 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    position: relative;
}

.s4-sub {
    font-size: clamp(0.85rem, 1.8vw, 1.2rem);
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    animation: fadeUp 0.5s 0.65s ease-out both;
    position: relative;
}

.s4-pills {
    display: flex;
    gap: 10px;
    animation: fadeUp 0.5s 0.8s ease-out both;
    position: relative;
}
.s4-pill {
    font-size: clamp(0.55rem, 1.1vw, 0.75rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 100px;
    border: 1px solid;
}
.s4-pill.p1 { color:#00d4ff; border-color:rgba(0,212,255,0.4); background:rgba(0,212,255,0.08); }
.s4-pill.p2 { color:#a855f7; border-color:rgba(168,85,247,0.4); background:rgba(168,85,247,0.08); }
.s4-pill.p3 { color:#00ff88; border-color:rgba(0,255,136,0.4); background:rgba(0,255,136,0.08); }
</style>
</head>
<body>
<div class="stage">

  <!-- SCREEN 1 — CALL -->
  <div class="scene current" id="s1">
    <div class="s1-label">Step 1</div>
    <div class="pulse-wrap">
      <div class="pulse-ring r1"></div>
      <div class="pulse-ring r2"></div>
      <div class="phone-icon">📞</div>
    </div>
    <div class="s1-number"><a href="tel:+12134440024">213 444-0024</a></div>
    <div class="s1-sub">Call or Text · Nationwide</div>
  </div>

  <!-- SCREEN 2 — BOOK A SESSION -->
  <div class="scene" id="s2">
    <div class="s2-step">Step 2</div>
    <div class="s2-headline">Book a<br><em>Session</em></div>
    <div class="s2-line-wrap"><div class="s2-line"></div></div>
    <div class="s2-sub">Pick a time that works for you</div>
  </div>

  <!-- SCREEN 3 — MEET OR ZOOM -->
  <div class="scene" id="s3">
    <div class="s3-step">Step 3</div>
    <div class="s3-split">
      <div class="s3-platform">
        <div class="s3-icon meet">📹</div>
        <div class="s3-name meet">Google Meet</div>
      </div>
      <div class="s3-or">or</div>
      <div class="s3-platform">
        <div class="s3-icon zoom">💻</div>
        <div class="s3-name zoom">Zoom</div>
      </div>
    </div>
    <div class="s3-headline">Live Screen-Share Session</div>
    <div class="s3-sub">From anywhere · No travel</div>
  </div>

  <!-- SCREEN 4 — CREATE! -->
  <div class="scene" id="s4">
    <div class="bg-shape c1"></div>
    <div class="bg-shape c2"></div>
    <div class="bg-shape c3"></div>
    <div class="bg-shape c4"></div>
    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="s4-step">Step 4</div>
    <div class="s4-word">Create!</div>
    <div class="s4-sub">Put your new skills to work</div>
    <div class="s4-pills">
      <div class="s4-pill p1">Photoshop</div>
      <div class="s4-pill p2">Premiere</div>
      <div class="s4-pill p3">DaVinci</div>
    </div>
    <div class="s4-pills" style="animation-delay:0.95s">
      <div class="s4-pill p1" style="color:#00e5c8;border-color:rgba(0,229,200,0.4);background:rgba(0,229,200,0.08)">ComfyUI</div>
      <div class="s4-pill p2" style="color:#f59e0b;border-color:rgba(245,158,11,0.4);background:rgba(245,158,11,0.08)">AI Apps</div>
      <div class="s4-pill p3" style="color:#ff6b9d;border-color:rgba(255,107,157,0.4);background:rgba(255,107,157,0.08)">Vibe Coding</div>
    </div>
  </div>

  <!-- PROGRESS DOTS -->
  <div class="nav">
    <div class="nav-dots">
      <div class="dot on"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
const scenes = [...document.querySelectorAll('.scene')];
const dots   = [...document.querySelectorAll('.dot')];
let cur = 0;

function resetAnims(scene) {
    const els = scene.querySelectorAll('*');
    els.forEach(el => { el.style.animation = 'none'; });
    void scene.offsetHeight;
    els.forEach(el => { el.style.animation = ''; });
}

scenes.forEach((s, i) => { if (i !== 0) resetAnims(s); });

function advance() {
    const next = (cur + 1) % scenes.length;

    scenes[next].style.transform = 'translateX(100%)';
    resetAnims(scenes[next]);

    requestAnimationFrame(() => {
        scenes[cur].classList.add('sliding');
        scenes[next].classList.add('sliding');
        scenes[cur].style.transform  = 'translateX(-100%)';
        scenes[next].style.transform = 'translateX(0)';

        setTimeout(() => {
            scenes[cur].classList.remove('current', 'sliding');
            scenes[cur].style.transform = 'translateX(-100%)';
            scenes[next].classList.add('current');
            scenes[next].classList.remove('sliding');
            dots[cur].classList.remove('on');
            cur = next;
            dots[cur].classList.add('on');
        }, 530);
    });
}

setInterval(advance, 4000);
</script>
</body>
