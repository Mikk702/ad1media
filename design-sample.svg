<!-- ── CENTER DOT ────────────────────────────── -->
<circle cx="540" cy="570" r="10" fill="#00d4ff" opacity="0.25" filter="url(#glow-lg)"/>
<circle cx="540" cy="570" r="4"  fill="#00d4ff" filter="url(#glow-sm)"/>
