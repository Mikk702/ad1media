<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad1.tv — Typography & Transitions</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #040810;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'FreightNeo Pro','freight-neo-pro',serif;
    overflow: hidden;
}

/* ── STAGE ────────────────────────────────── */
.stage {
    width: min(460px, 100vw);
    height: min(818px, 100svh);
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    background: radial-gradient(ellipse at 30% 20%, #0e1a2e 0%, #080e1c 55%, #040810 100%);
    border: 1px solid rgba(255,255,255,0.07);
}

/* ── SCENE BASE ───────────────────────────── */
.scene {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    will-change: transform;
    /* start hidden right */
    transform: translateX(100%);
}

.scene.current { transform: translateX(0); }

/* ── NAV ARROWS ───────────────────────────── */
.nav {
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    z-index: 10;
}

.nav-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
}
.nav-btn:hover { background: rgba(0,212,255,0.15); color: #00d4ff; border-color: rgba(0,212,255,0.4); }

.nav-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    min-width: 80px;
    text-align: center;
}

/* ══════════════════════════════════════════
   STYLE 1 — CHARACTER CASCADE
   Each character rains in from above, staggered
══════════════════════════════════════════ */
#s1 { gap: 20px; }

@keyframes charDrop {
    from { opacity: 0; transform: translateY(-60px) rotate(-8deg); }
    to   { opacity: 1; transform: translateY(0) rotate(0deg); }
}
@keyframes wordRise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

#s1 .label {
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
}

#s1 .cascade-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    line-height: 1;
}

#s1 .cascade-wrap .ch {
    display: inline-block;
    font-size: clamp(3.5rem, 14vw, 6rem);
    font-weight: 900;
    background: linear-gradient(135deg, #00d4ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
}

#s1 .sub {
    font-size: clamp(1rem, 3vw, 1.4rem);
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0;
    animation: wordRise 0.7s 1.2s ease-out forwards;
}

#s1 .tag {
    font-size: clamp(0.8rem, 2.5vw, 1.1rem);
    font-weight: 700;
    color: #00d4ff;
    letter-spacing: 0.08em;
    opacity: 0;
    animation: wordRise 0.7s 1.5s ease-out forwards;
}

/* ══════════════════════════════════════════
   STYLE 2 — TYPEWRITER
══════════════════════════════════════════ */
#s2 { gap: 24px; align-items: flex-start; padding-left: 40px; }

@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes typeReveal { from { width: 0; } to { width: 100%; } }

#s2 .tw-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: #00ff88;
    text-transform: uppercase;
    font-weight: 700;
}

.tw-line {
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
}

.tw-text {
    overflow: hidden;
    white-space: nowrap;
    width: 0;
    font-weight: 700;
    color: #fff;
}

.tw-cursor {
    width: 3px;
    flex-shrink: 0;
    background: #00d4ff;
    margin-left: 4px;
    animation: blink 0.8s infinite;
}

.tw-line:nth-child(2) .tw-text { font-size: clamp(2rem, 7vw, 3.2rem); height: clamp(2.5rem, 8vw, 4rem); }
.tw-line:nth-child(2) .tw-cursor { height: clamp(2.5rem, 8vw, 4rem); }

.tw-line:nth-child(3) .tw-text { font-size: clamp(2rem, 7vw, 3.2rem); height: clamp(2.5rem, 8vw, 4rem); color: #a855f7; }
.tw-line:nth-child(3) .tw-cursor { height: clamp(2.5rem, 8vw, 4rem); display: none; }

.tw-line:nth-child(4) .tw-text { font-size: clamp(2rem, 7vw, 3.2rem); height: clamp(2.5rem, 8vw, 4rem); color: #00ff88; }
.tw-line:nth-child(4) .tw-cursor { height: clamp(2.5rem, 8vw, 4rem); display: none; }

.tw-line:nth-child(5) .tw-text { font-size: clamp(2rem, 7vw, 3.2rem); height: clamp(2.5rem, 8vw, 4rem); color: #00e5c8; }
.tw-line:nth-child(5) .tw-cursor { height: clamp(2.5rem, 8vw, 4rem); }

/* ══════════════════════════════════════════
   STYLE 3 — WORD ELASTIC POP
══════════════════════════════════════════ */
#s3 { gap: 16px; }

@keyframes elasticPop {
    0%   { opacity: 0; transform: scale(0) skewX(-18deg); }
    60%  { opacity: 1; transform: scale(1.15) skewX(-18deg); }
    80%  { transform: scale(0.95) skewX(-18deg); }
    100% { opacity: 1; transform: scale(1) skewX(-18deg); }
}
@keyframes lineGrow { from { width: 0; } to { width: 100%; } }

.pop-word {
    font-size: clamp(3rem, 12vw, 5.5rem);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.02em;
    display: inline-block;
    opacity: 0;
}

#s3 .accent { font-size: clamp(0.9rem, 2.5vw, 1.3rem); font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.18em; text-transform: uppercase; opacity: 0; animation: wordRise 0.5s ease-out forwards; }
#s3 .sep { width: 0; height: 2px; background: linear-gradient(90deg, #00d4ff, #a855f7, #00ff88); border-radius: 2px; animation: lineGrow 0.8s ease-out forwards; }
#s3 .phone-pop { font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 600; color: #fff; opacity: 0; animation: wordRise 0.6s ease-out forwards; }

/* ══════════════════════════════════════════
   STYLE 4 — SVG STROKE DRAW
══════════════════════════════════════════ */
#s4 { gap: 28px; }

#s4 .draw-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
}

#s4 svg text {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
}

@keyframes drawStroke {
    from { stroke-dashoffset: 1; }
    to   { stroke-dashoffset: 0; }
}

#s4 .draw-sub {
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0;
    animation: wordRise 0.6s 2s ease-out forwards;
    text-align: center;
}

/* ══════════════════════════════════════════
   STYLE 5 — CLIP WIPE REVEAL
══════════════════════════════════════════ */
#s5 { gap: 20px; }

@keyframes wipeReveal {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0% 0 0); }
}
@keyframes wipeUp {
    from { clip-path: inset(100% 0 0 0); }
    to   { clip-path: inset(0 0 0 0); }
}

.wipe-line {
    overflow: hidden;
}

.wipe-text {
    display: block;
    font-weight: 900;
    animation: wipeReveal 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    clip-path: inset(0 100% 0 0);
}

.wipe-text.up {
    animation: wipeUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    clip-path: inset(100% 0 0 0);
}

#s5 .w1 { font-size: clamp(2rem, 7vw, 3.4rem); color: #fff; letter-spacing: -0.02em; animation-delay: 0.1s; }
#s5 .w2 {
    font-size: clamp(2rem, 7vw, 3.4rem);
    background: linear-gradient(135deg, #00d4ff, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    animation-delay: 0.3s;
    filter: drop-shadow(0 0 20px rgba(0,212,255,0.4));
}
#s5 .w3 { font-size: clamp(1.2rem, 3.5vw, 1.8rem); color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; animation-delay: 0.55s; }
#s5 .w4 { font-size: clamp(1.8rem, 5.5vw, 2.6rem); color: #00d4ff; font-weight: 700; animation-delay: 0.8s; letter-spacing: 0.04em; }
#s5 .w5 { font-size: clamp(1rem, 3vw, 1.4rem); color: rgba(255,255,255,0.3); font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; animation-delay: 1.05s; }

/* ── TRANSITION ENGINE ────────────────────── */
.sliding {
    transition: transform 0.55s cubic-bezier(0.77, 0, 0.175, 1);
}
</style>
</head>
<body>
<div class="stage">

    <!-- ── SCENE 1: Character Cascade ──────── -->
    <div class="scene current" id="s1">
        <div class="label">Style 1 — Character Cascade</div>
        <div class="cascade-wrap" id="cascade-text"></div>
        <div class="sub">Media Tutoring</div>
        <div class="tag">213 444-0024</div>
    </div>

    <!-- ── SCENE 2: Typewriter ─────────────── -->
    <div class="scene" id="s2">
        <div class="tw-label">Style 2 — Typewriter</div>
        <div class="tw-line">
            <div class="tw-text" id="tw1">Learn.</div>
            <div class="tw-cursor"></div>
        </div>
        <div class="tw-line">
            <div class="tw-text" id="tw2">Master.</div>
        </div>
        <div class="tw-line">
            <div class="tw-text" id="tw3">Create.</div>
        </div>
        <div class="tw-line">
            <div class="tw-text" id="tw4">Ad1.tv</div>
            <div class="tw-cursor"></div>
        </div>
    </div>

    <!-- ── SCENE 3: Elastic Pop ────────────── -->
    <div class="scene" id="s3">
        <div class="accent">One on One Tutoring</div>
        <div class="pop-word" id="pw1" style="color:#00d4ff;">Learn</div>
        <div class="pop-word" id="pw2" style="color:#a855f7;">Master</div>
        <div class="pop-word" id="pw3" style="color:#00ff88;">Create</div>
        <div class="sep"></div>
        <div class="phone-pop"><a href="tel:+12134440024" style="color:inherit;text-decoration:none;">213 444-0024</a></div>
    </div>

    <!-- ── SCENE 4: SVG Stroke Draw ─────────── -->
    <div class="scene" id="s4">
        <div class="draw-label">Style 4 — Stroke Draw</div>
        <svg id="draw-svg" width="100%" viewBox="0 0 380 160" xmlns="http://www.w3.org/2000/svg">
            <text x="190" y="90"
                text-anchor="middle"
                font-family="'FreightNeo Pro','freight-neo-pro',Arial Black,serif"
                font-size="100"
                font-weight="900"
                stroke="#00d4ff"
                stroke-width="1.5"
                pathLength="1"
                class="draw-main">Ad1.tv</text>
            <text x="190" y="140"
                text-anchor="middle"
                font-family="'FreightNeo Pro','freight-neo-pro',Arial,serif"
                font-size="22"
                font-weight="700"
                letter-spacing="6"
                stroke="#a855f7"
                stroke-width="0.8"
                pathLength="1"
                class="draw-sub-text">MEDIA TUTORING</text>
        </svg>
        <div class="draw-sub">Video · Photo · AI · Vibe Coding</div>
    </div>

    <!-- ── SCENE 5: Clip Wipe ──────────────── -->
    <div class="scene" id="s5">
        <div class="wipe-line"><span class="wipe-text w1">Creative Skills.</span></div>
        <div class="wipe-line"><span class="wipe-text w2">Mastered.</span></div>
        <div class="wipe-line"><span class="wipe-text up w3">One on One · Google Meet · Zoom</span></div>
        <div class="wipe-line"><span class="wipe-text up w4"><a href="tel:+12134440024" style="color:inherit;text-decoration:none;">213 444-0024</a></span></div>
        <div class="wipe-line"><span class="wipe-text up w5">ad1.tv</span></div>
    </div>

    <!-- ── NAV ────────────────────────────── -->
    <div class="nav">
        <button class="nav-btn" id="prev">&#8592;</button>
        <div class="nav-label" id="nav-label">1 / 5</div>
        <button class="nav-btn" id="next">&#8594;</button>
    </div>

</div>

<script>
const scenes = [...document.querySelectorAll('.scene')];
const labels = ['Cascade','Typewriter','Elastic Pop','SVG Draw','Clip Wipe'];
let cur = 0;

/* ── PUSH TRANSITION ─────────────────── */
function go(dir) {
    const next = (cur + dir + scenes.length) % scenes.length;
    const outX = dir > 0 ? '-100%' : '100%';
    const inX  = dir > 0 ?  '100%' : '-100%';

    scenes[next].style.transform = `translateX(${inX})`;
    scenes[next].style.display = 'flex';

    requestAnimationFrame(() => {
        scenes[cur].classList.add('sliding');
        scenes[next].classList.add('sliding');

        scenes[cur].style.transform = `translateX(${outX})`;
        scenes[next].style.transform = 'translateX(0)';

        setTimeout(() => {
            scenes[cur].classList.remove('current','sliding');
            scenes[cur].style.transform = `translateX(${outX})`;
            scenes[next].classList.add('current');
            scenes[next].classList.remove('sliding');
            cur = next;
            document.getElementById('nav-label').textContent = `${cur+1} / ${scenes.length}  ·  ${labels[cur]}`;
            playScene(cur);
        }, 560);
    });
}

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);

/* keyboard nav */
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft')  go(-1);
});

/* ── SCENE ANIMATIONS ────────────────── */
function playScene(i) {
    if (i === 0) playCascade();
    if (i === 1) playTypewriter();
    if (i === 2) playElastic();
    if (i === 3) playDraw();
    if (i === 4) playWipe();
}

/* Scene 1 — cascade */
function playCascade() {
    const wrap = document.getElementById('cascade-text');
    wrap.innerHTML = '';
    'Ad1.tv'.split('').forEach((ch, i) => {
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = ch;
        span.style.animation = `charDrop 0.5s cubic-bezier(0.34,1.56,0.64,1) ${i*0.1}s forwards`;
        wrap.appendChild(span);
    });
}

/* Scene 2 — typewriter */
function playTypewriter() {
    const lines = [
        { el: document.getElementById('tw1'), delay: 300,  speed: 80  },
        { el: document.getElementById('tw2'), delay: 900,  speed: 80  },
        { el: document.getElementById('tw3'), delay: 1500, speed: 80  },
        { el: document.getElementById('tw4'), delay: 2200, speed: 100 },
    ];
    const texts = ['Learn.','Master.','Create.','Ad1.tv'];
    lines.forEach((l,i) => {
        l.el.style.width = '0';
        l.el.style.transition = 'none';
        setTimeout(() => {
            const chars = texts[i].length;
            l.el.style.transition = `width ${chars * l.speed}ms steps(${chars})`;
            l.el.style.width = `${chars}ch`;
        }, l.delay);
    });
}

/* Scene 3 — elastic pop */
function playElastic() {
    const pws = ['pw1','pw2','pw3'];
    pws.forEach((id,i) => {
        const el = document.getElementById(id);
        el.style.animation = 'none';
        el.style.opacity = '0';
        void el.offsetHeight;
        el.style.animation = `elasticPop 0.6s cubic-bezier(0.34,1.56,0.64,1) ${i*0.25+0.3}s forwards`;
    });
    const acc = document.querySelector('#s3 .accent');
    acc.style.animation = 'none'; acc.style.opacity = '0';
    void acc.offsetHeight;
    acc.style.animation = 'wordRise 0.5s 0.1s ease-out forwards';
    const sep = document.querySelector('#s3 .sep');
    sep.style.animation = 'none'; sep.style.width = '0';
    void sep.offsetHeight;
    sep.style.animation = 'lineGrow 0.8s 1.2s ease-out forwards';
    const ph = document.querySelector('#s3 .phone-pop');
    ph.style.animation = 'none'; ph.style.opacity = '0';
    void ph.offsetHeight;
    ph.style.animation = 'wordRise 0.6s 1.4s ease-out forwards';
}

/* Scene 4 — SVG stroke draw */
function playDraw() {
    const texts = document.querySelectorAll('#draw-svg text');
    texts.forEach((t, i) => {
        const len = t.getTotalLength ? t.getTotalLength() : 500;
        t.style.strokeDasharray = len;
        t.style.strokeDashoffset = len;
        t.style.transition = 'none';
        void t.offsetHeight;
        t.style.transition = `stroke-dashoffset ${i === 0 ? 1.8 : 1.2}s ${i * 1.6 + 0.2}s ease-out`;
        t.style.strokeDashoffset = '0';
    });
}

/* Scene 5 — clip wipe */
function playWipe() {
    document.querySelectorAll('#s5 .wipe-text').forEach(el => {
        el.style.animation = 'none';
        void el.offsetHeight;
        const anim = el.classList.contains('up') ? 'wipeUp' : 'wipeReveal';
        const delay = getComputedStyle(el).animationDelay;
        const dur   = getComputedStyle(el).animationDuration || '0.7s';
        el.style.clipPath = el.classList.contains('up') ? 'inset(100% 0 0 0)' : 'inset(0 100% 0 0)';
        /* re-read delays from the CSS */
        const delays = {'w1':'0.1s','w2':'0.3s','w3':'0.55s','w4':'0.8s','w5':'1.05s'};
        const cls = [...el.classList].find(c => delays[c]) || 'w1';
        el.style.animation = `${anim} 0.7s ${delays[cls]} cubic-bezier(0.4,0,0.2,1) forwards`;
    });
}

/* init */
playCascade();
document.getElementById('nav-label').textContent = `1 / 5  ·  ${labels[0]}`;
</script>
</body>
</html>
