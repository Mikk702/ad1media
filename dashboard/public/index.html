<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ad1.tv — Traffic</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0c0c0f; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; padding: 36px 28px; max-width: 860px; }
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
header h1 { font-size: 1rem; font-weight: 500; color: #555; letter-spacing: .1em; text-transform: uppercase; }
.range { display: flex; gap: 8px; }
.range button { background: transparent; border: 1px solid #2a2a2e; color: #666; padding: 6px 18px; border-radius: 6px; cursor: pointer; font-size: .82rem; transition: border-color .15s, color .15s; }
.range button:hover { border-color: #444; color: #aaa; }
.range button.active { border-color: #00d4ff; color: #00d4ff; }
.cards { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
.card { background: #111115; border: 1px solid #1e1e24; border-radius: 10px; padding: 22px 24px; flex: 1; min-width: 130px; }
.card .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: #444; margin-bottom: 10px; }
.card .value { font-size: 2.2rem; font-weight: 600; color: #fff; line-height: 1; }
.chart-box { background: #111115; border: 1px solid #1e1e24; border-radius: 10px; padding: 22px 24px; margin-bottom: 16px; }
.chart-box .chart-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: #444; margin-bottom: 18px; }
</style>
</head>
<body>

<header>
  <h1>Ad1.tv &mdash; Traffic</h1>
  <div class="range">
    <button data-days="7" class="active">7d</button>
    <button data-days="30">30d</button>
    <button data-days="90">90d</button>
  </div>
</header>

<div class="cards">
  <div class="card"><div class="label">Visitors</div><div class="value" id="c-visitors">—</div></div>
  <div class="card"><div class="label">Pageviews</div><div class="value" id="c-pageviews">—</div></div>
  <div class="card"><div class="label">Countries</div><div class="value" id="c-countries">—</div></div>
</div>

<div class="chart-box">
  <div class="chart-label">Daily Visitors</div>
  <canvas id="sparkline" height="120"></canvas>
</div>

<div class="chart-box">
  <div class="chart-label">Top Countries</div>
  <canvas id="country-chart" height="200"></canvas>
</div>

<script>
let pw = sessionStorage.getItem('dash_pw');
if (!pw) {
  pw = prompt('Password:');
  if (pw) sessionStorage.setItem('dash_pw', pw);
}

Chart.defaults.color = '#555';
Chart.defaults.borderColor = '#1e1e24';

let sparkChart, countryChart;

async function load(days) {
  const res = await fetch(`/api/stats?days=${days}`, {
    headers: { 'x-dashboard-password': pw }
  });
  if (res.status === 401) {
    sessionStorage.removeItem('dash_pw');
    alert('Wrong password.');
    location.reload();
    return;
  }
  const d = await res.json();

  document.getElementById('c-visitors').textContent = d.visitors.toLocaleString();
  document.getElementById('c-pageviews').textContent = d.pageviews.toLocaleString();
  document.getElementById('c-countries').textContent = d.countries.length;

  const labels = d.daily.map(r => {
    const s = r.date;
    return `${s.slice(4,6)}/${s.slice(6,8)}`;
  });

  if (sparkChart) sparkChart.destroy();
  sparkChart = new Chart(document.getElementById('sparkline'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: d.daily.map(r => r.visitors),
        borderColor: '#00d4ff',
        backgroundColor: 'rgba(0,212,255,.07)',
        fill: true, tension: .35, pointRadius: 0, borderWidth: 1.5,
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: '#18181f' } }
      }
    }
  });

  if (countryChart) countryChart.destroy();
  countryChart = new Chart(document.getElementById('country-chart'), {
    type: 'bar',
    data: {
      labels: d.countries.map(c => c.name),
      datasets: [{
        data: d.countries.map(c => c.count),
        backgroundColor: 'rgba(168,85,247,.65)',
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, grid: { color: '#18181f' } },
        y: { grid: { display: false } }
      }
    }
  });
}

document.querySelectorAll('.range button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    load(+btn.dataset.days);
  });
});

load(7);
</script>
</body>
</html>
